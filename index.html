<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nhóm 10 — Bộ thủ giao tiếp</title>
<style>
:root{
  --paper:#faf6ef; --ink:#2b2620; --muted:#8a7d6c;
  --line:#e8dcc8; --accent:#2a6b8a; --accent-soft:#d8e8f0;
  --cjk:"Noto Serif CJK SC","Songti SC","PingFang SC","Microsoft YaHei",serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
     background:var(--paper);color:var(--ink);line-height:1.5}
main{max-width:600px;margin:0 auto;padding:24px 18px 56px}
h1{font-size:.9rem;font-weight:600;margin:0 0 4px;text-align:center;
   color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
h1 + p{text-align:center;font-size:.8rem;color:var(--muted);margin:0 0 16px}

.stage{background:#fff;border-radius:26px;padding:10px;
       border:1.5px solid var(--line);overflow:hidden;
       box-shadow:0 8px 32px rgba(42,107,138,.08)}
svg#fig{width:100%;height:auto;display:block}

.hotspot{cursor:pointer;outline:none;
  transform-box:fill-box;transform-origin:center;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.hotspot:hover{transform:scale(1.14)}
.hotspot circle{
  fill:url(#spot);stroke:var(--accent);stroke-width:1.8;
  filter:drop-shadow(0 2px 4px rgba(42,107,138,.3));
  transition:fill .2s,stroke-width .2s;
}
.hotspot .glyph{
  font-family:var(--cjk);font-size:24px;fill:var(--ink);
  text-anchor:middle;dominant-baseline:central;
  pointer-events:none;transition:fill .2s;
}
.hotspot.sel{transform:scale(1.14)}
.hotspot.sel circle{fill:var(--accent);stroke:#1a4a5e;stroke-width:2.5}
.hotspot.sel .glyph{fill:#fff}
.hotspot:focus-visible circle{stroke-width:4}

.card{background:#fff;border-radius:26px;border:1.5px solid var(--line);
      padding:28px 20px 26px;margin-top:14px;text-align:center;min-height:260px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      box-shadow:0 8px 32px rgba(42,107,138,.08)}
.card .icon{font-size:76px;line-height:1;margin-bottom:12px;
             filter:drop-shadow(0 4px 10px rgba(0,0,0,.12))}
.card .glyph{font-family:var(--cjk);font-size:62px;line-height:1;
             color:var(--accent);margin-bottom:4px}
.card .variant{font-family:var(--cjk);font-size:.95rem;color:var(--muted);
               margin-bottom:6px}
.card .pron{font-size:1.3rem;margin:0 0 2px;letter-spacing:.02em}
.card .pron .hv{color:var(--muted);margin-left:8px;font-size:1rem;letter-spacing:0}
.card .meaning{font-size:1.3rem;font-weight:600;margin:0 0 20px;
               color:var(--accent)}
.card .examples{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.card .ex{display:flex;flex-direction:column;align-items:center;gap:1px;
          padding:8px 12px;border-radius:12px;background:#fdfaf5;
          border:1px solid var(--line);min-width:60px}
.card .ex .c{font-family:var(--cjk);font-size:28px;line-height:1.15}
.card .ex .hv{font-size:.7rem;color:var(--muted)}
.card .ex .m{font-size:.78rem}
.card .hint{color:var(--muted);font-size:1.1rem}
</style>
</head>
<body>
<main>
  <h1>Nhóm 10 — Bộ thủ giao tiếp</h1>
  <p>Chạm vào cuộc trò chuyện</p>

  <section class="stage">
    <svg id="fig" viewBox="0 0 520 420" role="img" aria-label="Hai người đang trò chuyện">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#b8dcec"/>
          <stop offset="100%" stop-color="#e8f2f6"/>
        </linearGradient>
        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#a4cc80"/>
          <stop offset="100%" stop-color="#5a7a38"/>
        </linearGradient>
        <radialGradient id="skin" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#ffe4c8"/>
          <stop offset="100%" stop-color="#e8b088"/>
        </radialGradient>
        <linearGradient id="shirtA" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6a9ad8"/>
          <stop offset="100%" stop-color="#3a6aa0"/>
        </linearGradient>
        <linearGradient id="shirtB" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e88098"/>
          <stop offset="100%" stop-color="#b04060"/>
        </linearGradient>
        <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4a5a6e"/>
          <stop offset="100%" stop-color="#2a3a4e"/>
        </linearGradient>
        <linearGradient id="bubbleG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#e8f0f4"/>
        </linearGradient>
        <radialGradient id="spot" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#fff"/>
          <stop offset="100%" stop-color="#e8ecf4"/>
        </radialGradient>
        <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>

      <!-- bầu trời -->
      <rect width="520" height="420" fill="url(#sky)"/>

      <!-- mặt trời nhỏ -->
      <circle cx="470" cy="55" r="20" fill="#ffd23f" opacity="0.85"/>
      <circle cx="470" cy="55" r="30" fill="#ffd23f" opacity="0.22" filter="url(#blur)"/>

      <!-- mây -->
      <ellipse cx="80" cy="55" rx="30" ry="10" fill="#fff" opacity="0.7"/>
      <ellipse cx="102" cy="50" rx="22" ry="11" fill="#fff" opacity="0.7"/>

      <!-- đồi xa -->
      <path d="M0 280 Q130 250 260 275 Q390 250 520 275 L520 300 L0 300 Z"
            fill="#a8c890" opacity="0.7"/>

      <!-- mặt đất -->
      <rect y="290" width="520" height="130" fill="url(#grass)"/>

      <!-- ===== BONG BÓNG NÓI (bên trái, từ A) ===== -->
      <g id="bubble">
        <!-- bong bóng -->
        <path d="M 75 110 Q 75 70 135 70 Q 195 70 195 110 Q 195 150 135 150 L 110 150 L 100 170 L 105 150 Q 75 148 75 110 Z"
              fill="url(#bubbleG)" stroke="#8ab0c8" stroke-width="2"/>
        <!-- ba chấm -->
        <circle cx="115" cy="110" r="6" fill="#5a7a98"/>
        <circle cx="140" cy="110" r="6" fill="#5a7a98"/>
        <circle cx="165" cy="110" r="6" fill="#5a7a98"/>
      </g>

      <!-- ===== BONG BÓNG NÓI (bên phải, từ B) ===== -->
      <g id="bubble2">
        <path d="M 325 165 Q 325 130 380 130 Q 435 130 435 165 Q 435 200 380 200 L 355 200 L 348 218 L 352 200 Q 325 198 325 165 Z"
              fill="url(#bubbleG)" stroke="#a88098" stroke-width="2"/>
        <!-- hai chấm + tim nhỏ -->
        <circle cx="360" cy="165" r="5" fill="#8a5a78"/>
        <circle cx="400" cy="165" r="5" fill="#8a5a78"/>
      </g>

      <!-- ===== NGƯỜI A (bên trái, đang nói) ===== -->
      <g id="personA">
        <!-- bóng -->
        <ellipse cx="135" cy="405" rx="42" ry="6" fill="#2a3a1a" opacity="0.28"/>

        <!-- chân -->
        <rect x="118" y="352" width="14" height="55" fill="url(#pants)" rx="3"/>
        <rect x="138" y="352" width="14" height="55" fill="url(#pants)" rx="3"/>
        <ellipse cx="125" cy="410" rx="11" ry="4.5" fill="#1a1008"/>
        <ellipse cx="145" cy="410" rx="11" ry="4.5" fill="#1a1008"/>

        <!-- thân -->
        <path d="M 112 282 Q 112 268 122 263 L 148 263 Q 158 268 158 282 L 158 358 Q 135 365 112 358 Z"
              fill="url(#shirtA)"/>
        <path d="M 124 265 L 135 278 L 146 265" stroke="#2a4a80" stroke-width="2"
              fill="none" stroke-linejoin="round"/>

        <!-- tay phải chỉ lên (hướng tới bong bóng) -->
        <path d="M 155 288 Q 170 265 168 235" stroke="url(#shirtA)" stroke-width="15"
              stroke-linecap="round" fill="none"/>
        <circle cx="168" cy="230" r="8" fill="url(#skin)"/>

        <!-- tay trái xuôi -->
        <path d="M 115 288 Q 100 310 100 350" stroke="url(#shirtA)" stroke-width="15"
              stroke-linecap="round" fill="none"/>
        <circle cx="100" cy="355" r="7" fill="url(#skin)"/>

        <!-- cổ -->
        <rect x="128" y="248" width="12" height="18" rx="3" fill="url(#skin)"/>

        <!-- đầu -->
        <circle cx="135" cy="232" r="25" fill="url(#skin)"/>
        <path d="M 111 232 Q 107 205 135 202 Q 163 205 159 232 Q 155 216 135 214 Q 115 216 111 232 Z"
              fill="#3a2a1a"/>
        <!-- mắt -->
        <circle cx="127" cy="232" r="2.2" fill="#2a1a08"/>
        <circle cx="143" cy="232" r="2.2" fill="#2a1a08"/>
        <!-- miệng mở (đang nói) -->
        <ellipse cx="135" cy="245" rx="5" ry="4" fill="#a04040"/>
      </g>

      <!-- ===== NGƯỜI B (bên phải, đang nghe) ===== -->
      <g id="personB">
        <ellipse cx="390" cy="405" rx="42" ry="6" fill="#2a3a1a" opacity="0.28"/>

        <rect x="373" y="352" width="14" height="55" fill="url(#pants)" rx="3"/>
        <rect x="393" y="352" width="14" height="55" fill="url(#pants)" rx="3"/>
        <ellipse cx="380" cy="410" rx="11" ry="4.5" fill="#1a1008"/>
        <ellipse cx="400" cy="410" rx="11" ry="4.5" fill="#1a1008"/>

        <!-- thân áo hồng -->
        <path d="M 368 282 Q 368 268 378 263 L 402 263 Q 412 268 412 282 L 412 358 Q 390 365 368 358 Z"
              fill="url(#shirtB)"/>
        <path d="M 380 265 L 390 278 L 400 265" stroke="#8a2040" stroke-width="2"
              fill="none" stroke-linejoin="round"/>

        <!-- tay trái giơ lên ngang (hướng về A) -->
        <path d="M 370 288 Q 350 295 330 285" stroke="url(#shirtB)" stroke-width="15"
              stroke-linecap="round" fill="none"/>
        <circle cx="325" cy="284" r="7" fill="url(#skin)"/>

        <!-- tay phải xuôi -->
        <path d="M 410 288 Q 425 310 425 350" stroke="url(#shirtB)" stroke-width="15"
              stroke-linecap="round" fill="none"/>
        <circle cx="425" cy="355" r="7" fill="url(#skin)"/>

        <!-- cổ -->
        <rect x="384" y="248" width="12" height="18" rx="3" fill="url(#skin)"/>

        <!-- tóc dài -->
        <path d="M 363 235 Q 358 290 366 335 L 376 335 Q 366 290 372 240 Z" fill="#3a1a10"/>
        <path d="M 417 235 Q 422 290 414 335 L 404 335 Q 414 290 408 240 Z" fill="#3a1a10"/>

        <!-- đầu -->
        <circle cx="390" cy="232" r="25" fill="url(#skin)"/>
        <path d="M 366 232 Q 362 205 390 202 Q 418 205 414 232 Q 410 216 390 214 Q 370 216 366 232 Z"
              fill="#3a1a10"/>
        <circle cx="382" cy="232" r="2.2" fill="#2a1a08"/>
        <circle cx="398" cy="232" r="2.2" fill="#2a1a08"/>
        <!-- miệng cười -->
        <path d="M 385 244 Q 390 248 395 244" stroke="#a04040" stroke-width="1.8"
              fill="none" stroke-linecap="round"/>
        <!-- má hồng -->
        <ellipse cx="374" cy="240" rx="4" ry="2.5" fill="#ff8a9a" opacity="0.55"/>
        <ellipse cx="406" cy="240" rx="4" ry="2.5" fill="#ff8a9a" opacity="0.55"/>
      </g>

      <g id="hotspots"></g>
    </svg>
  </section>

  <section class="card" id="card"></section>
</main>

<script>
const NS = "http://www.w3.org/2000/svg";

const RADICALS = {
  yan: {glyph:"言", variant:"讠", pinyin:"yán", hv:"ngôn", meaning:"lời nói", icon:"💬",
        ex:[{c:"说",hv:"thuyết",m:"nói"},{c:"语",hv:"ngữ",m:"ngôn ngữ"},{c:"话",hv:"thoại",m:"lời"}]}
};

const SPOTS = [
  {id:"yan", x:135, y:110, r:22}   /* bong bóng nói bên trái */
];

const panel    = document.getElementById("card");
const svgSpots = document.getElementById("hotspots");

SPOTS.forEach(s => {
  const r = RADICALS[s.id];
  const g = document.createElementNS(NS,"g");
  g.setAttribute("class","hotspot");
  g.setAttribute("tabindex","0");
  g.setAttribute("role","button");
  g.setAttribute("aria-label", r.pinyin + " " + r.hv);
  g.dataset.id = s.id;

  const c = document.createElementNS(NS,"circle");
  c.setAttribute("cx",s.x); c.setAttribute("cy",s.y); c.setAttribute("r",s.r);

  const t = document.createElementNS(NS,"text");
  t.setAttribute("class","glyph");
  t.setAttribute("x",s.x); t.setAttribute("y",s.y);
  t.textContent = r.glyph;

  g.append(c,t);
  g.addEventListener("click", () => select(s.id));
  g.addEventListener("keydown", e => {
    if(e.key==="Enter"||e.key===" "){ e.preventDefault(); select(s.id); }
  });
  svgSpots.appendChild(g);
});

function select(id){
  document.querySelectorAll(".hotspot").forEach(el =>
    el.classList.toggle("sel", el.dataset.id === id));
  renderCard(id);
}

function renderCard(id){
  const r = RADICALS[id];
  panel.innerHTML = `
    <div class="icon">${r.icon}</div>
    <div class="glyph">${r.glyph}</div>
    ${r.variant ? `<div class="variant">biến thể: ${r.variant}</div>` : ""}
    <p class="pron">${r.pinyin}<span class="hv">· ${r.hv}</span></p>
    <p class="meaning">${r.meaning}</p>
    <div class="examples">
      ${r.ex.map(x => `
        <div class="ex">
          <span class="c">${x.c}</span>
          <span class="hv">${x.hv}</span>
          <span class="m">${x.m}</span>
        </div>`).join("")}
    </div>`;
}

panel.innerHTML = `<p class="hint">👆 Chạm vào bong bóng nói</p>`;
</script>
</body>
</html>
